services:
  prometheus:
    image: prom/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    ports:
      - "127.0.0.1:9115:9115"

volumes:
  grafana_data:
    external: true
    name: homelab-observability_grafana_data

  prometheus_data:
    external: true
    name: homelab-observability_prometheus_data
